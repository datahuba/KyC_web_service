name: Deploy Backend to VPS

on:
  push:
    branches:
      - develop_kevin

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Conectarse al Servidor por SSH y Actualizar Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "📥 === SINCRONIZACIÓN NUCLEAR BACKEND === 📥"
            # ISSUE-MIGRACION (2026-07-17): movido de /var/www/backend a /root/postgrado/backend
            # (al lado de /root/oys-deploy/ para convivencia multi-proyecto en el VPS)
            cd /root/postgrado/backend
            # 1. Descargar todo de la nube sin fusionar
            git fetch --all
            # 2. Forzar al servidor a pararse en nuestra rama
            git checkout develop_kevin || git checkout -b develop_kevin origin/develop_kevin
            # 3. Botón Nuclear: Destruir diferencias y hacer un clon exacto
            git reset --hard origin/develop_kevin

            echo "🚀 === RECONSTRUYENDO DOCKER === 🚀"
            cd /root/postgrado
            docker compose build --no-cache backend
            docker compose up -d --no-deps --force-recreate backend

            echo "🧹 === LIMPIEZA DE IMÁGENES HUÉRFANAS === 🧹"
            # Elimina de forma segura imágenes colgantes (<none>:<none>) creadas en la compilación para liberar espacio en tu VPS
            docker image prune -f