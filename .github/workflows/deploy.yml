name: Deploy Backend to VPS

on:
  push:
    branches:
      - develop_kevin

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Conectarse al Servidor por SSH y Actualizar Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          # F-ACTIONS-FIX (2026-07-21): migrado de password a SSH key.
          # El VPS fue endurecido (sesión 18-19 julio) y ya no acepta password.
          # Nuevas secret keys en GitHub: VPS_SSH_HOST, VPS_SSH_USER, VPS_SSH_KEY.
          # VPS_SSH_HOST contiene la IP (ej: 84.247.181.176).
          host: ${{ secrets.VPS_SSH_HOST }}
          # F-ACTIONS-FIX: el VPS está en puerto 2222 (cerramos el 22).
          # Sin este param, el action usa default 22 → connection refused.
          port: 2222
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # El user 'deploy' tiene sudo NOPASSWD para docker (verificado 2026-07-21).
          # El host de la key es el de deploy_user; el de 'root' no acepta key-based.
          command_timeout: 20m
          script: |
            # F-ACTIONS-FIX (2026-07-21): todo el script se ejecuta con sudo.
            # El user 'deploy' tiene sudo NOPASSWD pero no puede acceder
            # directamente a /root/ (permisos del filesystem).
            #
            # F-ACTIONS-DEPLOY-UNIFIED (2026-07-30): antes este workflow tenia
            # su propio script inline con flock, que entraba en conflicto con
            # deploys manuales SSH (lock file compartido). Ahora ambos flujos
            # usan /usr/local/bin/kyc-deploy (mismo lock, mismo marker, mismo log,
            # health check al final). El script unificado detecta el marker stale
            # y se autocura; nunca se queda colgado mas de 15 min.
            sudo -n bash -c '
              set -e
              # Instalar el script si no existe (idempotente, copy desde el repo)
              if [[ ! -f /usr/local/bin/kyc-deploy ]]; then
                install -m 0755 /root/postgrado/backend/scripts/kyc-deploy.sh /usr/local/bin/kyc-deploy
                echo "kyc-deploy instalado en /usr/local/bin/"
              fi

              # Log de quien disparo el deploy (util para auditoria)
              echo "=== DEPLOY disparado por GitHub Actions ===" >> /tmp/deploy-backend.log
              echo "    triggered_by=github-actions sha=$(git -C /root/postgrado/backend rev-parse origin/develop_kevin 2>/dev/null || echo unknown)" >> /tmp/deploy-backend.log

              # Ejecutar el deploy unificado. El script maneja:
              # - lock con flock + timeout 15 min
              # - marker file /tmp/deploy-in-progress (con timestamp)
              # - cleanup automatico con trap (incluso si Ctrl+C o error)
              # - health check post-deploy
              /usr/local/bin/kyc-deploy
            '
