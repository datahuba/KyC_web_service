name: Deploy Backend to VPS

on:
  push:
    branches:
      - develop_kevin

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Conectarse al Servidor por SSH y Actualizar Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          # F-ACTIONS-FIX (2026-07-21): migrado de password a SSH key.
          # El VPS fue endurecido (sesión 18-19 julio) y ya no acepta password.
          # Nuevas secret keys en GitHub: VPS_SSH_HOST, VPS_SSH_USER, VPS_SSH_KEY.
          # VPS_SSH_HOST contiene la IP (ej: 84.247.181.176).
          host: ${{ secrets.VPS_SSH_HOST }}
          # F-ACTIONS-FIX: el VPS está en puerto 2222 (cerramos el 22).
          # Sin este param, el action usa default 22 → connection refused.
          port: 2222
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # El user 'deploy' tiene sudo NOPASSWD para docker (verificado 2026-07-21).
          # El host de la key es el de deploy_user; el de 'root' no acepta key-based.
          command_timeout: 15m
          script: |
            # F-ACTIONS-FIX (2026-07-21): todo el script se ejecuta con sudo.
            # El user 'deploy' tiene sudo NOPASSWD pero no puede acceder
            # directamente a /root/ (permisos del filesystem).
            sudo -n bash << 'REMOTE_EOF'
            set -e
            echo "📥 === SINCRONIZACIÓN NUCLEAR BACKEND === 📥"
            # ISSUE-MIGRACION (2026-07-17): movido de /var/www/backend a /root/postgrado/backend
            # (al lado de /root/oys-deploy/ para convivencia multi-proyecto en el VPS)
            cd /root/postgrado/backend

            # F-ACTIONS-FIX: refspec explícito para forzar la actualización de la ref local.
            # El `git fetch --all` por defecto no descarga nuevos commits en una rama
            # si cree que ya la tiene sincronizada (lo descubrimos en deploy manual).
            git fetch origin +refs/heads/develop_kevin:refs/remotes/origin/develop_kevin
            echo "🔖 SHA remoto descargado:"
            git rev-parse origin/develop_kevin

            # Forzar al servidor a pararse en nuestra rama
            git checkout develop_kevin || git checkout -b develop_kevin origin/develop_kevin

            # Botón Nuclear: Destruir diferencias y hacer un clon exacto
            git reset --hard origin/develop_kevin
            git clean -fd
            echo "🆕 HEAD actual:"
            git log --oneline -3

            echo "🚀 === RECONSTRUYENDO DOCKER === 🚀"
            cd /root/postgrado
            # F-ACTIONS-DEPLOY-FIX (2026-07-23): eliminamos el container viejo
            # con `docker compose down` + `docker rm -f` directo para evitar el
            # error "Conflict. The container name '/kyc-backend' is already
            # in use" que pasa cuando el `up -d --force-recreate` no puede
            # recrear el container. El frontend workflow ya tenía este fix.
            docker compose down backend 2>/dev/null || true
            docker rm -f kyc-backend 2>/dev/null || true
            docker rmi -f $(docker images -q postgrado-backend) 2>/dev/null || true
            docker compose build --no-cache backend

            echo "🔄 === REINICIANDO BACKEND === 🔄"
            docker compose up -d --no-deps --force-recreate backend
            sleep 3
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.CreatedAt}}' | grep -E 'kyc-backend|postgrado-backend' || echo "WARN: kyc-backend no encontrado en docker ps"

            echo "🧹 === LIMPIEZA DE IMÁGENES HUÉRFANAS === 🧹"
            # Elimina de forma segura imágenes colgantes (<none>:<none>) creadas en la compilación para liberar espacio
            docker image prune -f

            echo "✅ DEPLOY COMPLETADO"
            docker logs kyc-backend --tail 5
            REMOTE_EOF
