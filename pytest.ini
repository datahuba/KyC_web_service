[pytest]
# TECH-001: configuración de pytest para KyC web service
# Ejecutar con: pytest -v  (o: pytest -v tests/test_payment_service.py)

# Patrón de discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Mostrar output verbose por defecto
addopts = -v --tb=short --color=yes

# Warnings: ignorar los deprecation de datetime.utcnow() (lo arreglaremos en próxima migración)
filterwarnings =
    ignore::DeprecationWarning:datetime

# Async mode
asyncio_mode = auto
